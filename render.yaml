services:
  # Backend Service
  - type: web
    name: jbfg-ltv-backend
    env: python
    build_command: pip install --upgrade pip && pip install -r requirements.txt
    start_command: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1
    env_vars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LTV_ADVISOR_MODEL
        value: gpt-5-nano
      - key: LTV_ADVISOR_MAX_OUTPUT_TOKENS
        value: "2000"
      - key: LTV_ADVISOR_REASONING_EFFORT
        value: minimal
      - key: LTV_USE_WEB_SEARCH
        value: "false"
      - key: LTV_WEB_SEARCH_CONTEXT
        value: medium
      - key: LTV_AI_CONCURRENCY
        value: "4"
      - key: PYTHON_VERSION
        value: 3.11.0

staticSites:
  # Frontend Service (Static Site)
  - name: jbfg-ltv-frontend
    root_directory: frontend
    build_command: npm install && npm run build
    publish_dir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    env_vars:
      - key: VITE_API_BASE_URL
        from_service:
          name: jbfg-ltv-backend
          type: web
          property: host
