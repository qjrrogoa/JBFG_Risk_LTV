services:
  # Backend Service
  - type: web
    name: jbfg-ltv-backend
    env: python
    build_command: pip install -r requirements.txt
    start_command: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    env_vars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

  # Frontend Service (Static Site)
  - type: static
    name: jbfg-ltv-frontend
    root_directory: frontend
    build_command: npm install && npm run build
    publish_dir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    env_vars:
      - key: VITE_API_BASE_URL
        from_service:
          name: jbfg-ltv-backend
          type: web
          property: host
